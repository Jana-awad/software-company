<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Software Company</title>
    <link rel="stylesheet" href="bootstrap.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white">
      <div class="container-fluid">
        <a class="navbar-brand nav-logo order-0" href="/">
          <img src="logo2.png" alt="" />
          dev.io
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavDropdown"
          aria-controls="navbarNavDropdown"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse justify-content-center"
          id="navbarNavDropdown"
        >
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="/">Services</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/">Developers</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/">Company</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/">Pricing</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-content">
          <p class="hero-eyebrow">
            <span class="hero-eyebrow-dot" aria-hidden="true"></span>
            Your partner in digital progress
          </p>
          <h1 id="hero-title">
            Great ideas deserve
            <span>great software.</span>
          </h1>
          <p class="hero-description">
            We design, build, and scale digital products that help ambitious
            businesses do their best work.
          </p>
          <div class="hero-trust">
            <span class="hero-trust-line" aria-hidden="true"></span>
            <p>From first sketch to the next big thing.</p>
          </div>
        </div>
      </section>
    </main>
    <script src="bootstrap.bundle.min.js"></script>
  </body>
</html>
